name: Accessibility Checks

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check-a11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Run Accessibility Checks
        uses: berkeley-cdss/myst-a11y@v1
        with:
          exclude: "iframe[src*='youtube.com'], #movie_player, .myst-footer-link, .myst-footer-link-prev, .myst-footer-link-next"
